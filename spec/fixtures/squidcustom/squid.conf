# squid conf

# configure auth
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm Squid proxy proxy-caching web server
auth_param basic credentialsttl 2 hours

# exposed proxy ports
# don't need https_port, as we only need http proxy (normal and CONNECT ones)
http_port 3128

acl authenticated proxy_auth REQUIRED

acl whitelist dstdomain ocspserver
acl http proto http
acl port_crl port 10080
acl port_ocsp port 2560

# Destination host
acl calculator_host dstdomain calculator1 calculator2
acl calculator_port port 8080
acl calculator_ws urlpath_regex ^/ws
acl kong_loopback port 9000
acl kong_loopback_api urlpath_regex ^/loopback

# Allow access
http_access allow calculator_host calculator_port calculator_ws kong_loopback kong_loopback_api authenticated

# rules allowing non-authenticated users
http_access allow http port_crl whitelist
http_access allow http port_ocsp whitelist

http_access allow authenticated

# catch-all rule
http_access deny all
