services:
  squid:
    hostname: squid
    image: ubuntu/squid:5.2-22.04_beta
    platform: linux/arm64/v8
    volumes:
      - ${PONGO_WD}/spec/fixtures/squidcustom/squid.conf:/etc/squid/squid.conf
      - ${PONGO_WD}/spec/fixtures/squidcustom/passwords:/etc/squid/passwords
    healthcheck:
      interval: 5s
      retries: 10
      test: ["CMD", "kill", "-0", "1"]
      timeout: 10s
    restart: on-failure
    ports:
      - 127.0.0.1::3128
    stop_signal: SIGKILL
    networks:
      - ${NETWORK_NAME}
